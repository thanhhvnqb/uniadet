[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uniadet-reimplementation"
version = "0.1.0"
description = "Language-free universal visual anomaly detection based on AdaptCLIP"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[dependency-groups]
dev = ["pytest>=8"]

# Match the CUDA 12.6 driver used for training. Keep other dependencies on PyPI.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[project.scripts]
uniadet = "uniadet.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["uniadet*", "lib*"]

[tool.setuptools.package-data]
lib = ["*.gz"]
